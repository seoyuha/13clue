<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#173F35" />
<title>Eco Detectives · 교사 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
:root{
  --pine:#173F35; --pine2:#22574A; --paper:#F3F6EC; --paper2:#E4EBD9; --line:#C9D6C0;
  --ink:#1D2A44; --ink2:#55607A; --stamp:#D2463C; --sun:#F6C445; --leaf:#3FA066; --sky:#5AA9E6;
  --ko:'Jua',system-ui,sans-serif; --en:'Lexend',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--pine);color:var(--ink);font-family:var(--ko);font-size:16px}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.en{font-family:var(--en)}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:#fff;margin-bottom:16px}
.brand{font-family:var(--en);font-weight:800;font-size:22px;margin-right:auto}
.brand small{display:block;font-family:var(--ko);font-weight:400;font-size:14px;opacity:.75}
.codebox{background:var(--paper);color:var(--ink);border-radius:18px;padding:10px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 0 #0f2d26}
.codebox .lbl{font-size:14px;color:var(--ink2);line-height:1.3}
.codebox .code{font-family:var(--en);font-weight:800;font-size:44px;letter-spacing:6px;color:var(--stamp)}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 6px 0 #0f2d26;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-weight:400;font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h2 small{font-size:14px;color:var(--ink2)}
.btn{border:0;display:inline-flex;align-items:center;gap:6px;padding:12px 16px;border-radius:14px;font-size:17px;background:var(--pine2);color:#fff;box-shadow:0 4px 0 #0f2d26}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f2d26}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #b88d1d}
.btn.red{background:var(--stamp);box-shadow:0 4px 0 #8f2a23}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--paper2);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;padding:10px 16px;border-radius:10px;font-size:17px}
.seg button.on{background:var(--ink);color:#fff}
.students{display:flex;flex-wrap:wrap;gap:8px}
.st{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 8px 6px 12px;display:flex;align-items:center;gap:6px;font-size:16px}
.st i{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}
.st i.on{background:var(--leaf)}
.st button{border:0;background:var(--paper2);border-radius:50%;width:24px;height:24px;font-size:12px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.group{background:#fff;border-radius:16px;border:2px solid var(--line);padding:12px}
.group h3{margin:0 0 8px;font-weight:400;font-size:18px}
.group .m{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 0;border-top:1px dashed var(--line)}
.group select{border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--paper);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 6px 0 #0f2d26}
.stat b{display:block;font-family:var(--en);font-weight:800;font-size:30px}
.stat span{font-size:14px;color:var(--ink2)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.game{background:var(--paper);border-radius:18px;padding:14px;box-shadow:0 6px 0 #0f2d26}
.game.done{outline:3px solid var(--sun)}
.game-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.game-head h3{margin:0;font-weight:400;font-size:20px}
.game-head .t{margin-left:auto;font-family:var(--en);font-size:14px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:400;color:var(--ink2);font-size:13px;text-align:left;padding:4px}
td{padding:6px 4px;border-top:1px dashed var(--line);vertical-align:middle}
.bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:4px}
.bar i{display:block;height:100%;background:var(--leaf)}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:13px;background:var(--paper2)}
.badge.solved{background:var(--sun)}
.badge.wait{background:#dbeefa}
.badge.pen{background:#fbe0de}
.ans{font-size:20px;letter-spacing:2px}
.feed{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.5}
.feed .en{color:var(--ink)}
.cols{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.rank div{display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px dashed var(--line);font-size:17px}
.rank b{font-family:var(--en);width:44px}
.miss > div{padding:8px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr auto;column-gap:10px}
.miss > div .r{grid-row:1/3;grid-column:2;align-self:center}
.miss .q{font-family:var(--en);font-weight:600;font-size:15px}
.miss .a{font-size:13px;color:var(--ink2)}
.miss .r{color:var(--stamp);font-family:var(--en);font-weight:800;font-size:18px}
.hint{color:var(--ink2);font-size:14px;margin:8px 0 0;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:90}
.conn{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--stamp);color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;z-index:95}
.podium{display:flex;gap:16px;justify-content:center;align-items:flex-end;margin:10px 0 20px;flex-wrap:wrap}
.podium > div{background:#fff;border-radius:16px;padding:14px 18px;text-align:center;min-width:150px;border:3px solid var(--line)}
.podium > div:first-child{border-color:var(--sun);transform:scale(1.08)}
.podium .n{font-size:24px}
.podium .s{font-family:var(--en);font-weight:800;font-size:22px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d = null) { try { const v = localStorage.getItem('eco13t.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('eco13t.' + k, JSON.stringify(v)); } catch {} },
};
let ws, D = null, CARD = {};
let pickMode = store.get('mode', 'team'), pickSize = store.get('size', 4), showAns = false, view = 'live';

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function connect() {
  ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
  ws.onopen = () => { $('#conn')?.remove(); ws.send(JSON.stringify({ t: 'teacherHello', code: store.get('code'), key: store.get('key') })); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === 'teacherKey') { store.set('code', m.code); store.set('key', m.key); }
    else if (m.t === 'teacher') { D = m.data; render(); }
    else if (m.t === 'err') toast(m.msg);
  };
  ws.onclose = () => {
    if (!$('#conn')) { const c = document.createElement('div'); c.id = 'conn'; c.className = 'conn'; c.textContent = '서버에 다시 연결하는 중…'; document.body.appendChild(c); }
    setTimeout(connect, 1500);
  };
}
const send = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const nameOf = (pid) => D.students.find((s) => s.pid === pid)?.name || '?';

function render() {
  if (!D) return;
  const app = $('#app');
  const joinUrl = location.origin;
  const online = D.students.filter((s) => s.online).length;
  app.innerHTML = `
  <header>
    <div class="brand">🌏 Eco Detectives · 교사 관리<small>6학년 영어 12단원 We Should Save the World</small></div>
    <div class="codebox"><div class="lbl">학생 접속 주소<br><b class="en">${esc(joinUrl.replace(/^https?:\/\//, ''))}</b></div><div><div class="lbl">반 코드</div><div class="code">${esc(D.code)}</div></div></div>
  </header>
  ${D.status === 'LOBBY' || D.status === 'ASSIGNED' ? lobbyHTML(online) : liveHTML()}`;
  bind();
}

// ── 대기실: 모드 선택, 자동 배정, 시작 ──
function lobbyHTML(online) {
  const waiting = D.students;
  return `
  <div class="panel">
    <h2>👥 입장한 학생 <b class="en">${waiting.length}</b>명 <small>(접속 중 ${online}명) · 학생은 주소에 들어가 이름과 반 코드를 입력해요</small></h2>
    <div class="students">${waiting.length ? waiting.map((s) => `<span class="st"><i class="${s.online ? 'on' : ''}"></i>${esc(s.name)}<button data-kick="${s.pid}" title="명단에서 빼기">✕</button></span>`).join('') : '<span class="hint">아직 입장한 학생이 없어요. 반 코드를 화면에 띄워 주세요.</span>'}</div>
  </div>
  <div class="panel">
    <h2>⚙️ 게임 방식 정하기</h2>
    <div class="row">
      <div class="seg"><button data-mode="solo" class="${pickMode === 'solo' ? 'on' : ''}">🕵️ 혼자 버전</button><button data-mode="team" class="${pickMode === 'team' ? 'on' : ''}">🤝 팀 버전</button></div>
      ${pickMode === 'team' ? `<div class="seg"><button data-size="3" class="${pickSize === 3 ? 'on' : ''}">3명씩</button><button data-size="4" class="${pickSize === 4 ? 'on' : ''}">4명씩</button></div>` : ''}
      <button class="btn" id="assign" ${waiting.length ? '' : 'disabled'}>🎲 ${D.groups.length ? '다시 섞기' : '자동 배정'}</button>
      <button class="btn sun" id="start" ${D.groups.length ? '' : 'disabled'}>🚀 모두 동시에 시작</button>
    </div>
    <p class="hint">${pickMode === 'solo'
      ? '혼자 버전: 학생마다 컴퓨터 증인 3명(💧Drop ⚡Spark 🌿Leafy)과 사건을 풀어요. 개인 속도로 진행해요.'
      : '팀 버전: 모둠 친구끼리 서로의 비밀 카드를 보고 영어 질문에 대답해 줘요. 인원이 맞지 않으면 2~5명 모둠이 생길 수 있어요.'}
      한 판은 보통 10~15분 걸려요. 미션 2개를 맞히면 질문 1번, 3개를 맞힐 때마다 🔍 토큰 1개가 생겨요.</p>
    ${D.groups.length ? `<div class="groups">${D.groups.map((g, gi) => `<div class="group"><h3>${g.length === 1 ? '🕵️ 혼자' : `🤝 ${gi + 1}모둠`} <small style="color:var(--ink2)">${g.length}명</small></h3>
      ${g.map((p) => `<div class="m"><span>${esc(nameOf(p))}</span>${pickMode === 'team' ? `<select data-move="${p}"><option value="">옮기기</option>${D.groups.map((_, j) => j !== gi ? `<option value="${j}">${j + 1}모둠으로</option>` : '').join('')}<option value="-1">새 모둠</option></select>` : ''}</div>`).join('')}</div>`).join('')}</div>` : ''}
  </div>`;
}

// ── 진행 현황 ──
function seatStatus(s) {
  if (s.solvedRank) return `<span class="badge solved">🏆 해결 ${s.solvedRank}등</span>`;
  if (s.penalty) return `<span class="badge pen">보고서 오답 · 미션 ${s.penalty}개 남음</span>`;
  if (s.phase === 'WAIT') return '<span class="badge wait">친구 대답 기다림</span>';
  if (s.phase === 'ASK') return '<span class="badge wait">질문 고르는 중</span>';
  return '<span class="badge">미션 푸는 중</span>';
}
function liveHTML() {
  const now = Date.now();
  const humans = D.games.flatMap((g) => g.seats.filter((s) => !s.bot).map((s) => ({ ...s, game: g })));
  const solved = humans.filter((s) => s.solvedRank).length;
  const mc = humans.reduce((a, s) => a + s.mCorrect, 0), mt = humans.reduce((a, s) => a + s.mTotal, 0);
  const waitingStudents = D.students.filter((s) => !s.gameId);
  // 해결한 학생이 먼저(해결 시간 순), 그다음 점수 순
  const ranked = humans.slice().sort((a, b) => {
    if (!!a.solvedAt !== !!b.solvedAt) return a.solvedAt ? -1 : 1;
    if (a.solvedAt && b.solvedAt) return (a.solvedAt - a.game.startedAt) - (b.solvedAt - b.game.startedAt);
    return b.score - a.score;
  });
  const ended = D.status === 'ENDED';
  return `
  <div class="stats">
    <div class="stat"><b>${mmss((ended ? (Math.max(...D.games.map((g) => g.finishedAt || now), now)) : now) - (D.startedAt || now))}</b><span>${ended ? '게임 종료' : '진행 시간'}</span></div>
    <div class="stat"><b>${solved}/${humans.length}</b><span>사건 해결</span></div>
    <div class="stat"><b>${mt ? Math.round((mc / mt) * 100) : 0}%</b><span>미션 정답률 (${mc}/${mt})</span></div>
    <div class="stat"><b>${humans.reduce((a, s) => a + s.asked, 0)}</b><span>영어 질문 수</span></div>
  </div>
  <div class="panel" style="padding:12px 16px">
    <div class="row">
      <button class="btn ghost" id="toggle-ans">${showAns ? '🙈 정답 카드 숨기기' : '👀 정답 카드 보기'}</button>
      ${waitingStudents.length && !ended ? `<button class="btn" id="late">⏱️ 늦게 온 학생 ${waitingStudents.length}명 혼자 버전으로 시작</button>` : ''}
      <span style="margin-left:auto"></span>
      ${ended ? '' : '<button class="btn red" id="end">⏹ 게임 종료하고 결과 보기</button>'}
      <button class="btn ghost" id="reset">🔁 새 판 (학생 명단 유지)</button>
    </div>
  </div>
  ${ended ? resultsHTML(ranked) : ''}
  <div class="cols">
    <div class="games">${D.games.map((g) => gameHTML(g, now)).join('')}</div>
    <div>
      <div class="panel rank"><h2>🏅 실시간 순위 <small>해결 시간 순 → 점수 순</small></h2>
        ${ranked.slice(0, 15).map((s, i) => `<div><b>${i + 1}</b><span style="flex:1">${esc(s.name)} <small style="color:var(--ink2)">${s.game.mode === 'team' ? esc(s.game.teamName) : ''}</small></span><span>${s.solvedAt ? '🏆 ' + mmss(s.solvedAt - s.game.startedAt) : '🔎'}</span><span class="en" style="width:52px;text-align:right">${s.score}</span></div>`).join('') || '<p class="hint">아직 기록이 없어요.</p>'}
      </div>
      <div class="panel miss"><h2>📉 많이 틀린 문제 <small>복습할 때 참고해요</small></h2>
        ${D.miss.filter((m) => m.wrong).map((m) => `<div><div class="q">${esc(m.label)}</div><span class="r">${m.wrong}/${m.total}</span><div class="a">${esc(m.skill)} · 정답: <span class="en">${esc(m.answer)}</span></div></div>`).join('') || '<p class="hint">아직 틀린 문제가 없어요.</p>'}
      </div>
    </div>
  </div>`;
}

function gameHTML(g, now) {
  const humans = g.seats.filter((s) => !s.bot);
  const last = g.lastLog.filter((e) => e.type === 'ask').slice(-2).reverse();
  return `<div class="game ${g.finishedAt ? 'done' : ''}">
    <div class="game-head"><h3>${g.mode === 'solo' ? '🕵️ ' + esc(g.teamName) : '🤝 ' + esc(g.teamName)}</h3><span class="t">⏱ ${mmss((g.finishedAt || now) - g.startedAt)}</span></div>
    <table><thead><tr><th>이름</th><th>미션</th><th>질문</th><th>상태</th>${showAns ? '<th>정답</th>' : ''}</tr></thead><tbody>
    ${humans.map((s) => {
      const pct = s.mTotal ? Math.round((s.mCorrect / s.mTotal) * 100) : 0;
      return `<tr><td>${esc(s.name)}</td><td class="en">${s.mCorrect}/${s.mTotal}<span class="bar"><i style="width:${pct}%"></i></span></td><td class="en">${s.asked}${g.mode === 'team' ? ` <small title="친구 질문에 대답한 수">↩${s.helped}</small>` : ''}</td><td>${seatStatus(s)}</td>${showAns ? `<td class="ans" title="${s.outer.map((id) => CARD[id]?.en).join(' / ')}">${s.outer.map((id) => CARD[id]?.emoji).join('')}</td>` : ''}</tr>`;
    }).join('')}
    </tbody></table>
    ${last.length ? `<div class="feed">${last.map((e) => `${esc(g.seats[e.from].name)} → ${esc(g.seats[e.to].name)}: <span class="en">${esc(e.text)}</span> <b class="en">${esc(e.reply)}</b>`).join('<br>')}</div>` : ''}
  </div>`;
}

function resultsHTML(ranked) {
  const top = ranked.slice(0, 3);
  return `<div class="panel" style="text-align:center"><h2 style="justify-content:center">🎉 Case Closed! 오늘의 지구 탐정</h2>
    <div class="podium">${top.map((s, i) => `<div><div style="font-size:34px">${['🥇', '🥈', '🥉'][i]}</div><div class="n">${esc(s.name)}</div><div class="s">${s.score}점</div><div style="font-size:13px;color:var(--ink2)">${s.solvedAt ? '해결 ' + mmss(s.solvedAt - s.game.startedAt) : '수사 중'}</div></div>`).join('')}</div>
    <p class="en" style="font-size:22px;font-weight:600">We should save the world! 🌏</p></div>`;
}

function bind() {
  document.querySelectorAll('[data-mode]').forEach((b) => (b.onclick = () => { pickMode = b.dataset.mode; store.set('mode', pickMode); render(); }));
  document.querySelectorAll('[data-size]').forEach((b) => (b.onclick = () => { pickSize = +b.dataset.size; store.set('size', pickSize); render(); }));
  document.querySelectorAll('[data-kick]').forEach((b) => (b.onclick = () => { if (confirmLite(b)) send({ t: 'kick', pid: b.dataset.kick }); }));
  document.querySelectorAll('[data-move]').forEach((s) => (s.onchange = () => { if (s.value !== '') send({ t: 'move', pid: s.dataset.move, to: +s.value }); }));
  const a = $('#assign'); if (a) a.onclick = () => send({ t: 'assign', mode: pickMode, size: pickSize });
  const st = $('#start'); if (st) st.onclick = () => send({ t: 'start' });
  const ta = $('#toggle-ans'); if (ta) ta.onclick = () => { showAns = !showAns; render(); };
  const lt = $('#late'); if (lt) lt.onclick = () => send({ t: 'startLate' });
  const en = $('#end'); if (en) en.onclick = () => { if (confirmLite(en, '한 번 더 누르면 모든 게임이 끝나요')) send({ t: 'end' }); };
  const rs = $('#reset'); if (rs) rs.onclick = () => { if (confirmLite(rs, '한 번 더 누르면 새 판을 준비해요')) send({ t: 'reset' }); };
}
// 두 번 눌러 확인 (브라우저 확인창 대신)
function confirmLite(btn, msg = '한 번 더 누르면 실행돼요') {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = '1'; toast(msg);
  setTimeout(() => { delete btn.dataset.armed; }, 3000);
  return false;
}

// 진행 시간 갱신
setInterval(() => { if (D && D.status === 'PLAYING') render(); }, 5000);

fetch('/api/data').then((r) => r.json()).then((d) => { d.CARDS.forEach((c) => (CARD[c.id] = c)); connect(); });
