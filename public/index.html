<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#173F35" />
<title>13 Clues – Eco Detectives</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
:root{
  --pine:#173F35; --pine2:#22574A; --pine3:#2E6B5B;
  --paper:#F3F6EC; --paper2:#E4EBD9; --line:#C9D6C0;
  --ink:#1D2A44; --ink2:#55607A;
  --stamp:#D2463C; --sun:#F6C445; --leaf:#3FA066; --sky:#5AA9E6;
  --ko:'Jua',system-ui,sans-serif; --en:'Lexend',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--pine);color:var(--ink);font-family:var(--ko);font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.en{font-family:var(--en)}
.hidden{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}

/* ── 입장 화면 ── */
.entry{flex:1;display:grid;place-items:center;padding:24px 16px}
.entry-box{width:min(440px,100%);background:var(--paper);border-radius:22px;padding:28px 24px 24px;box-shadow:0 10px 0 #0f2d26}
.entry-logo{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.entry-logo span{width:44px;height:60px;border-radius:8px;display:grid;place-items:center;font-size:26px;background:var(--pine2);color:#fff;transform:rotate(-6deg)}
.entry-logo span:nth-child(2){transform:rotate(3deg);background:var(--stamp)}
.entry-logo span:nth-child(3){transform:rotate(-2deg);background:var(--leaf)}
.entry h1{font-family:var(--en);font-weight:800;font-size:30px;text-align:center;margin:10px 0 2px;letter-spacing:-.5px}
.entry p.sub{text-align:center;margin:0 0 20px;color:var(--ink2)}
.field{display:block;margin-bottom:12px}
.field span{display:block;margin-bottom:6px;font-size:15px}
.field input{width:100%;font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.field input:focus{outline:none;border-color:var(--leaf)}
.code-input{font-family:var(--en)!important;letter-spacing:10px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;font-size:19px;background:var(--pine2);color:#fff;box-shadow:0 4px 0 #0f2d26;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f2d26}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #b88d1d}
.btn.red{background:var(--stamp);box-shadow:0 4px 0 #8f2a23}
.btn.ghost{background:transparent;color:var(--pine2);box-shadow:none;border:2px solid var(--line)}
.btn.block{width:100%}
.or{display:flex;align-items:center;gap:10px;color:var(--ink2);margin:16px 0 10px;font-size:14px}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--line)}
.err{color:var(--stamp);min-height:22px;text-align:center;margin:6px 0 0}

/* ── 대기실 ── */
.lobby{flex:1;display:grid;place-items:center;padding:24px 16px;color:#fff;text-align:center}
.lobby h2{font-size:30px;margin:12px 0 6px}
.lobby .mates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.lobby .mates span{background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:18px}
.mag{font-size:64px;animation:sweep 2.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:translateX(-20px) rotate(-10deg)}50%{transform:translateX(20px) rotate(10deg)}}

/* ── 게임 상단바 ── */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;flex-wrap:wrap}
.top .case{font-family:var(--en);font-weight:800;font-size:18px;letter-spacing:-.3px;margin-right:auto;display:flex;align-items:center;gap:8px}
.case-stamp{font-family:var(--ko);font-weight:400;font-size:13px;color:var(--stamp);background:var(--paper);padding:2px 8px;border-radius:6px;transform:rotate(-4deg);display:inline-block}
.pill{background:var(--pine2);border-radius:999px;padding:6px 12px;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill b{font-family:var(--en)}
.stars-row{display:flex;gap:2px}
.stars-row i{font-style:normal;opacity:.3}
.stars-row i.on{opacity:1}

/* ── 레이아웃 ── */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:0 14px 14px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.panel{background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 6px 0 #0f2d26}
.panel h3{margin:0 0 10px;font-size:19px;display:flex;align-items:center;gap:8px;font-weight:400}
.panel h3{flex-wrap:wrap}
.panel h3 small{color:var(--ink2);font-size:14px;margin-left:auto}
@media (max-width:560px){.panel h3 small{margin-left:0;width:100%}}

/* ── 미션 ── */
.mission .skill{display:inline-block;background:var(--pine2);color:#fff;border-radius:8px;padding:3px 10px;font-size:14px}
.mission .prompt{font-size:20px;margin:10px 0 12px;line-height:1.35}
.mission .pic{font-size:70px;text-align:center;margin:6px 0;letter-spacing:6px}
.mission .text{font-family:var(--en);font-size:26px;font-weight:600;line-height:1.35;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.speak{flex:none;width:52px;height:52px;border-radius:50%;background:var(--sky);color:#fff;font-size:24px;box-shadow:0 3px 0 #2f78b2}
.speak.big{width:88px;height:88px;font-size:40px;margin:10px auto;display:grid;place-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 12px;font-family:var(--en);font-size:19px;font-weight:600;min-height:64px;text-align:center;line-height:1.25}
.opt:active{background:var(--paper2)}
.opt.ko{font-family:var(--ko);font-weight:400}
.opts.big .opt{font-size:46px;min-height:92px}
.opt.right{background:#d9f3e2;border-color:var(--leaf)}
.opt.wrong{background:#fbe0de;border-color:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border-radius:14px}
.chips.answer{background:#fff;border:2px dashed var(--line);margin:12px 0 8px}
.chip{font-family:var(--en);font-weight:600;font-size:20px;padding:10px 14px;border-radius:12px;background:var(--sun);box-shadow:0 3px 0 #b88d1d}
.chips.answer .chip{background:var(--paper2);box-shadow:0 3px 0 var(--line)}
.row-btns{display:flex;gap:10px;margin-top:12px}
.row-btns .btn{flex:1}

/* 결과 표시 */
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:60;pointer-events:none}
.flash .box{background:var(--paper);border-radius:24px;padding:24px 30px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.25);max-width:88vw;animation:pop .25s ease-out}
.flash .big{font-size:76px;line-height:1}
.flash .msg{font-size:24px;margin-top:8px}
.flash .ans{font-family:var(--en);font-weight:600;font-size:22px;margin-top:8px;color:var(--pine2)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ── 질문하기 ── */
.ask-who{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.who{padding:10px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:18px}
.who.on{border-color:var(--pine2);background:var(--pine2);color:#fff}
.qtabs{display:flex;gap:6px;margin-bottom:10px}
.qtab{flex:1;padding:10px 6px;border-radius:12px;background:var(--paper2);font-size:15px;line-height:1.2}
.qtab.on{background:var(--ink);color:#fff}
.picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pk{padding:9px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-family:var(--en);font-weight:600;font-size:17px;display:flex;align-items:center;gap:6px}
.pk.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.sentence{font-family:var(--en);font-weight:800;font-size:25px;line-height:1.3;background:#fff;border-radius:14px;padding:14px 16px;border:2px solid var(--ink);display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0 12px}
.sentence .blank{color:var(--ink2);border-bottom:3px dotted var(--ink2)}
.wait{text-align:center;padding:26px 10px}
.wait .q{font-family:var(--en);font-weight:800;font-size:24px;margin:10px 0}
.timer{height:8px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:12px auto 0;max-width:320px}
.timer i{display:block;height:100%;background:var(--sun);transition:width 1s linear}

/* ── 사건 보드 ── */
.board-seat{border-radius:14px;padding:10px;background:#fff;border:2px solid var(--line);margin-bottom:10px}
.board-seat.me{border-color:var(--stamp);background:#fff7f6}
.seat-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:17px}
.seat-head .st{margin-left:auto;font-size:13px;color:var(--ink2)}
.cards{display:flex;gap:8px;flex-wrap:wrap}
.card{width:92px;min-height:118px;border-radius:12px;background:#fff;border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .band{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;font-size:12px;color:#fff;font-family:var(--en);font-weight:600}
.card .em{font-size:36px;text-align:center;margin:6px 0 2px;line-height:1}
.card .nm{font-family:var(--en);font-weight:600;font-size:12.5px;text-align:center;padding:0 5px 4px;line-height:1.15}
.card .tg{font-size:11px;text-align:center;color:var(--ink2);padding-bottom:6px;margin-top:auto}
.card.sm{width:76px;min-height:98px}
.card.sm .em{font-size:28px}
.card.sm .nm{font-size:11px}
.card.hiddenc{background:repeating-linear-gradient(45deg,#2b5a4e,#2b5a4e 8px,#245046 8px,#245046 16px);border-color:#173F35;align-items:center;justify-content:center;color:#fff}
.card.hiddenc .q{font-family:var(--en);font-weight:800;font-size:40px}
.card.hiddenc .lab{font-size:12px;opacity:.85}
.card.flip{animation:flip .6s ease-out both}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.solved-stamp{position:absolute;inset:auto 0 30% 0;margin:auto;width:max-content;font-family:var(--en);font-weight:800;font-size:15px;color:var(--stamp);border:3px solid var(--stamp);padding:2px 8px;border-radius:6px;transform:rotate(-14deg);background:rgba(255,255,255,.85)}
.secret-row{display:flex;gap:8px;flex-wrap:wrap}
.env{width:76px;height:98px;border-radius:12px;background:#d8c49a;border:2px solid #b49d6c;display:grid;place-items:center;font-family:var(--en);font-weight:800;font-size:30px;color:#6d5a33;position:relative}
.env small{position:absolute;bottom:6px;font-family:var(--ko);font-weight:400;font-size:11px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools .btn{flex:1;min-width:140px;font-size:17px;padding:12px}

/* 단서 기록 */
.log{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.log .it{background:#fff;border-radius:12px;padding:8px 10px;border:2px solid var(--line);font-size:14px}
.log .it.mine{border-color:var(--sky)}
.log .it .qq{font-family:var(--en);font-weight:600;font-size:15px}
.log .it .aa{font-family:var(--en);font-weight:800;color:var(--pine2);font-size:16px}
.log .empty{color:var(--ink2);font-size:15px;padding:6px 2px}

/* ── 모달 ── */
.modal{position:fixed;inset:0;background:rgba(10,30,25,.72);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;overflow:auto}
.modal .sheet{background:var(--paper);border-radius:22px;width:min(860px,100%);padding:18px;box-shadow:0 12px 0 rgba(0,0,0,.3)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{margin:0;font-weight:400;font-size:24px;flex:1}
.x{width:44px;height:44px;border-radius:12px;background:var(--paper2);font-size:22px}

/* 추리노트 */
.notes{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.notes th{font-weight:400;font-size:13px}
.notes td{padding:0}
.ncell{width:100%;min-height:62px;border-radius:10px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;position:relative;padding:2px}
.ncell .mk{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--en);font-weight:800;font-size:34px;pointer-events:none}
.ncell.X .mk{color:var(--stamp)}
.ncell.O .mk{color:var(--leaf)}
.ncell.X > span:not(.mk),.ncell.seen > span:not(.mk){opacity:.25}
.ncell.seen{background:var(--paper2);border-style:dashed}
.ncell small{font-family:var(--en);font-size:9.5px;line-height:1.05;text-align:center}
.legend{font-size:14px;color:var(--ink2);margin:6px 0 0;line-height:1.5}

/* 받은 질문 */
.incoming{position:fixed;inset:0;background:rgba(10,30,25,.78);z-index:70;display:grid;place-items:center;padding:16px}
.incoming .sheet{background:var(--paper);border-radius:24px;padding:20px;width:min(560px,100%);text-align:center;border:4px solid var(--sun)}
.incoming .who-asks{font-size:20px}
.incoming .q{font-family:var(--en);font-weight:800;font-size:28px;margin:10px 0;line-height:1.25}
.nums{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.nums .btn{min-width:84px;font-family:var(--en);font-weight:800;font-size:24px}

/* 리포트 */
.pick-grid{display:flex;flex-wrap:wrap;gap:8px}
.pick-grid .card{cursor:pointer}
.pick-grid .card.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.pick-grid .card.off{opacity:.3}
.report-paper{background:#fff;border-radius:16px;padding:16px;border:2px solid var(--line)}
.report-paper .line{font-family:var(--en);font-weight:600;font-size:22px;margin:8px 0}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps span{flex:1;text-align:center;padding:6px;border-radius:10px;background:var(--paper2);font-size:14px}
.steps span.on{background:var(--ink);color:#fff}

/* 결과 */
.result{text-align:center;padding:10px}
.result h2{font-size:34px;margin:6px 0}
.rank-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.rank-list div{background:#fff;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;border:2px solid var(--line)}
.rank-list b{font-family:var(--en);width:34px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:90;font-size:17px;max-width:90vw;text-align:center}
.conn{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--stamp);color:#fff;padding:6px 14px;border-radius:999px;font-size:14px;z-index:95}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
// ════════════════════════════════════════════════════════════
//  13 Clues – Eco Detectives : 학생 화면
// ════════════════════════════════════════════════════════════
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d = null) { try { const v = localStorage.getItem('eco13.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('eco13.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('eco13.' + k); } catch {} },
};
let DATA = null, CARD = {}, COLOR = {};
let ws = null, wsReady = false, retryMs = 800;
let screen = 'entry';     // entry | lobby | game
let V = null;             // 서버가 보낸 내 게임 화면 데이터
let lobby = null;
let pid = store.get('pid') || Math.random().toString(36).slice(2, 10);
store.set('pid', pid);

// 화면 상태 (서버와 무관)
const ui = { askTo: null, qKind: 'color', qColor: null, qTag: null, qCat: 'DO', order: {}, modal: null, report: null, lastMissionId: null, flashTimer: null, lastLogLen: 0, seenSolved: false };

// ── 음성 ──
function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.88;
    const v = speechSynthesis.getVoices().find((x) => /en[-_]US/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch {}
}

function toast(msg, ms = 2400) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

// ── 연결 ──
function connect() {
  const url = location.origin.replace(/^http/, 'ws');
  ws = new WebSocket(url);
  ws.onopen = () => {
    wsReady = true; retryMs = 800; showConn(false);
    const code = store.get('code'), name = store.get('name');
    if (code && name) send({ t: 'join', code, name, pid });
    else if (store.get('practice')) send({ t: 'resume', pid });
  };
  ws.onmessage = (e) => onMsg(JSON.parse(e.data));
  ws.onclose = () => { wsReady = false; showConn(true); setTimeout(connect, retryMs); retryMs = Math.min(retryMs * 1.6, 6000); };
}
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); else toast('연결 중이에요. 잠시 후 다시 눌러 주세요.'); }
function showConn(on) {
  let el = $('#conn');
  if (on && !el) { el = document.createElement('div'); el.id = 'conn'; el.className = 'conn'; el.textContent = '서버에 다시 연결하는 중…'; document.body.appendChild(el); }
  if (!on && el) el.remove();
}

function onMsg(m) {
  if (m.t === 'err') {
    if (m.code === 'nocode') { store.del('code'); screen = 'entry'; render(); }
    const e = $('#entry-err'); if (e) e.textContent = m.msg; else toast(m.msg);
  } else if (m.t === 'joined') {
    store.set('name', m.name);
    if (m.code) { store.set('code', m.code); store.del('practice'); } else store.set('practice', true);
  } else if (m.t === 'lobby') {
    lobby = m; screen = 'lobby'; V = null; render();
  } else if (m.t === 'state') {
    const prev = V; V = m.view; screen = 'game'; ui.skew = V.now - Date.now();
    onState(prev); render();
  } else if (m.t === 'noResume') {
    store.del('practice'); screen = 'entry'; render();
  } else if (m.t === 'retry') {
    toast('다시 세어 보세요! Count again. 🔍');
  } else if (m.t === 'solveResult') {
    ui.report = null; ui.modal = null;
    if (!m.ok) flash('❌', '아쉬워요! 정답이 아니에요.', '미션 2개를 더 맞히면 다시 도전할 수 있어요.', 2600);
  } else if (m.t === 'peekResult') {
    const c = CARD[m.cardId];
    flash(c.emoji, '비밀 카드를 확인했어요', `${c.en} — 이 카드는 내 카드가 아니에요!`, 2400);
  } else if (m.t === 'kicked') {
    store.del('code'); screen = 'entry'; render(); toast('선생님이 명단에서 정리했어요. 다시 입장해 주세요.');
  }
}

// 상태 변화에 따른 효과
function onState(prev) {
  const lr = V.lastResult;
  if (lr && (!prev || !prev.lastResult || prev.lastResult.at !== lr.at)) {
    if (lr.ok) flash('⭕', lr.tokenGained ? 'Great! 🔍 토큰 +1' : 'Great job!', null, 1100);
    else flash('❌', lr.timeout ? '시간이 지났어요' : 'Not quite!', '정답: ' + lr.correct, 2200);
  }
  // 새 단서 도착 (내가 한 질문)
  const mineNew = V.log.filter((e) => e.type === 'ask' && e.from === V.mySeat);
  const prevMine = prev ? prev.log.filter((e) => e.type === 'ask' && e.from === V.mySeat).length : mineNew.length;
  if (prev && mineNew.length > prevMine) {
    const e = mineNew[mineNew.length - 1];
    setTimeout(() => { speak(e.reply); flash('🔎', `${seatName(e.to)}: “${e.reply}”`, e.text, 2400, true); }, lr && prev.lastResult?.at !== lr.at ? 1200 : 0);
  }
  // 미션 바뀌면 듣기 문제 자동 재생
  if (V.mission && V.mission.id + (V.mission.words || V.mission.options || []).join() !== ui.lastMissionId) {
    ui.lastMissionId = V.mission.id + (V.mission.words || V.mission.options || []).join();
    ui.order[V.mission.id] = [];
    if (V.mission.hideText) setTimeout(() => speak(V.mission.say), 900);
  }
  if (V.seats[V.mySeat].solvedRank && !ui.seenSolved) { ui.seenSolved = true; ui.justSolved = true; speak('Case solved! We should save the world.'); }
  if (V.incoming.length && ui.lastIncoming !== V.incoming[0].id) { ui.lastIncoming = V.incoming[0].id; speak(V.incoming[0].text); }
}

function flash(big, msg, ans, ms = 1400, en = false) {
  clearTimeout(ui.flashTimer);
  const L = $('#layer');
  L.innerHTML = `<div class="flash"><div class="box"><div class="big">${big}</div><div class="msg ${en ? 'en' : ''}">${esc(msg)}</div>${ans ? `<div class="ans">${esc(ans)}</div>` : ''}</div></div>`;
  ui.flashTimer = setTimeout(() => { L.innerHTML = ''; }, ms);
}

// ── 카드 그리기 ──
function seatName(i) { const s = V.seats[i]; return (s.icon ? s.icon + ' ' : '') + s.name; }
function tagLabel(t) { return DATA.TAGS[t].icon + ' ' + t; }
function cardHTML(id, cls = '', attr = '') {
  const c = CARD[id]; const col = COLOR[c.color];
  const dark = c.color === 'white' || c.color === 'yellow';
  return `<div class="card ${cls}" data-card="${id}" ${attr}>
    <div class="band" style="background:${col.hex};color:${dark ? '#1D2A44' : '#fff'}"><span>${DATA.CATEGORIES[c.cat].icon}</span><span>${col.en}</span></div>
    <div class="em">${c.emoji}</div><div class="nm">${esc(c.en)}</div><div class="tg">${DATA.TAGS[c.tag].icon} ${c.tag}</div></div>`;
}
const CAT_LABEL = { PLACE: '📍 PLACE', DO: '✅ DO', DONT: "🚫 DON'T" };
function hiddenCard(cat, cls = '') { return `<div class="card hiddenc ${cls}"><div class="q">?</div><div class="lab">${CAT_LABEL[cat]}</div></div>`; }

// ── 렌더 ──
function render() {
  const app = $('#app');
  if (!DATA) { app.innerHTML = ''; return; }
  if (screen === 'entry') return renderEntry(app);
  if (screen === 'lobby') return renderLobby(app);
  if (screen === 'game' && V) return renderGame(app);
}

function renderEntry(app) {
  const name = store.get('name') || '';
  app.innerHTML = `<div class="entry"><div class="entry-box">
    <div class="entry-logo"><span>🔍</span><span>13</span><span>🌏</span></div>
    <h1>Eco Detectives</h1>
    <p class="sub">지구를 지키는 13개의 단서 · Lesson 12</p>
    <label class="field"><span>내 이름</span><input id="in-name" maxlength="12" value="${esc(name)}" placeholder="예: 김하늘" autocomplete="off"></label>
    <label class="field"><span>반 코드 (선생님 화면의 4자리 숫자)</span><input id="in-code" class="code-input" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"></label>
    <button class="btn block" id="go-join">수업에 입장하기</button>
    <div class="or">또는</div>
    <button class="btn ghost block" id="go-practice">🕵️ 혼자 연습하기 (컴퓨터 증인과 함께)</button>
    <p class="err" id="entry-err"></p>
  </div></div>`;
  $('#in-code').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4); });

    const n = $('#in-name').value.trim(), c = $('#in-code').value.trim();

function renderLobby(app) {
  const L = lobby;
  const assigned = L.status === 'ASSIGNED' && L.mates.length;
  app.innerHTML = `<div class="lobby"><div>
    <div class="mag">🔍</div>
    <h2>${esc(L.name)} 탐정, 입장 완료!</h2>
    <p>반 코드 <b class="en">${esc(L.code)}</b> · 선생님이 시작하면 바로 사건이 열려요.</p>
    ${assigned ? `<p style="margin-top:20px">${L.mode === 'solo' || L.mates.length === 1 ? '🕵️ 혼자 탐정 모드로 배정됐어요' : '🤝 우리 모둠 탐정들'}</p>
      <div class="mates">${L.mates.map((n) => `<span>${esc(n)}</span>`).join('')}</div>` : '<p style="opacity:.75">모둠을 배정하는 중이에요…</p>'}
    <p style="margin-top:28px"><button class="btn ghost" id="leave" style="color:#fff;border-color:rgba(255,255,255,.4)">다른 반 코드로 입장</button></p>
  </div></div>`;

function renderGame(app) {
  const me = V.seats[V.mySeat];
  const done = V.phase === 'DONE';
  const starsNeed = V.starsPerQ;
  const nextTok = V.tokenEvery - (me.mCorrect % V.tokenEvery);
  app.innerHTML = `
  <div class="top">
    <div class="case">🌏 Eco Detectives <span class="case-stamp">${V.mode === 'solo' ? '혼자 수사' : esc(V.teamName) + ' 수사'}</span></div>
    <div class="pill" title="미션 ${starsNeed}개를 맞히면 질문 1번">질문까지 <span class="stars-row">${Array.from({ length: starsNeed }, (_, i) => `<i class="${i < me.stars ? 'on' : ''}">⭐</i>`).join('')}</span></div>
    <div class="pill" title="미션 ${V.tokenEvery}개마다 +1">🔍 <b>${me.tokens}</b> <small style="opacity:.7">(${nextTok}개 더 맞히면 +1)</small></div>
    <div class="pill">✔ <b>${me.mCorrect}/${me.mTotal}</b></div>

// ── 왼쪽: 미션 / 질문 / 대기 ──
function actionPanel() {
  const me = V.seats[V.mySeat];
  if (me.solvedRank) {
    return `<div class="panel result"><div style="font-size:60px">🏆</div><h2>Case Solved!</h2>
      <p>${V.mode === 'team' ? `우리 모둠 <b>${me.solvedRank}등</b>으로 사건을 해결했어요!` : '사건을 해결했어요!'}</p>
      <p class="en" style="font-size:20px;font-weight:600">We should save the world. 🌏</p>
      ${V.mode === 'team' ? '<p style="color:var(--ink2)">친구들이 질문하면 계속 대답해 주세요. 친구들이 다 풀 때까지 기다려요.</p>' : '<p style="color:var(--ink2)">선생님이 끝내기 전까지 기다려요.</p>'}</div>`;
  }
  if (V.phase === 'MISSION' && V.mission) return missionPanel(V.mission);
  if (V.phase === 'ASK') return askPanel();
  if (V.phase === 'WAIT' && V.outgoing) {
    const left = Math.max(0, V.answerLimit - Math.floor((Date.now() + (ui.skew || 0) - V.outgoing.at) / 1000));
    return `<div class="panel wait"><div style="font-size:48px">⏳</div>
      <div>${esc(seatName(V.outgoing.to))}의 대답을 기다리는 중…</div>
      <div class="q en">${esc(V.outgoing.text)}</div>
      <div class="timer"><i id="wait-bar" style="width:${(left / V.answerLimit) * 100}%"></i></div>
      <p style="color:var(--ink2);font-size:14px">${V.answerLimit}초 안에 대답이 없으면 탐정 본부가 대신 알려 줘요.</p></div>`;
  }
  return `<div class="panel wait">잠시만요…</div>`;
}

function missionPanel(m) {
  let body = '';
  if (m.type === 'choice') {
    const isKo = m.options.every((o) => /[가-힣]/.test(o));
    body = `<div class="opts ${m.bigOptions ? 'big' : ''}">${m.options.map((o, i) => `<button class="opt ${isKo ? 'ko' : ''}" data-opt="${i}">${esc(o)}</button>`).join('')}</div>`;
  } else {
    const picked = ui.order[m.id] || [];
    const pool = m.words.map((w, i) => i).filter((i) => !picked.includes(i));
    body = `<div class="chips answer" id="ans-chips">${picked.length ? picked.map((i) => `<button class="chip" data-un="${i}">${esc(m.words[i])}</button>`).join('') : '<span style="color:var(--ink2);padding:8px">아래 낱말을 순서대로 눌러요</span>'}</div>
      <div class="chips">${pool.map((i) => `<button class="chip" data-pick="${i}">${esc(m.words[i])}</button>`).join('')}</div>
      <div class="row-btns"><button class="btn ghost" id="ord-reset">다시 하기</button><button class="btn sun" id="ord-ok" ${picked.length === m.words.length ? '' : 'disabled'}>정답 확인</button></div>`;
  }
  return `<div class="panel mission">
    <h3>🧩 Eco Mission <small>⭐ ${V.starsPerQ}개를 모으면 질문할 수 있어요</small></h3>
    <span class="skill">${esc(m.skill)}</span>
    <div class="prompt">${esc(m.prompt)}</div>
    ${m.pic ? `<div class="pic">${m.pic}</div>` : ''}
    ${m.hideText ? `<button class="speak big" id="say" aria-label="다시 듣기">🔊</button>` : ''}
    ${m.text ? `<div class="text"><span>${esc(m.text)}</span>${m.say ? '<button class="speak" id="say" aria-label="듣기">🔊</button>' : ''}</div>` : ''}
    ${body}
  </div>`;
}

const Q_TABS = [
  { k: 'color', label: 'How many<br>(색깔)' },
  { k: 'tag', label: 'How many<br>(종류)' },
  { k: 'is', label: 'Is my …?<br>(예/아니오)' },
];
function askSentence() {
  const B = (t) => `<span class="blank">${t}</span>`;
  if (ui.qKind === 'color') return `How many ${ui.qColor ? ui.qColor : B('____')} cards do I have?`;
  if (ui.qKind === 'tag') return `How many ${ui.qTag ? DATA.TAGS[ui.qTag].en : B('____')} do I have?`;
  return `Is my ${{ PLACE: 'PLACE', DO: 'DO', DONT: "DON'T" }[ui.qCat]} card ${ui.qColor ? ui.qColor : B('____')}?`;
}
function askReady() {
  if (ui.askTo === null) return false;
  if (ui.qKind === 'tag') return !!ui.qTag;
  return !!ui.qColor;
}
function askPanel() {
  const others = V.seats.filter((s) => s.seat !== V.mySeat);
  if (ui.askTo === null || ui.askTo === V.mySeat) ui.askTo = others.length === 1 ? others[0].seat : null;
  const colors = V.colorIds.map((c) => `<button class="pk ${ui.qColor === c ? 'on' : ''}" data-color="${c}"><i class="dot" style="background:${COLOR[c].hex}"></i>${c}</button>`).join('');
  const tags = Object.keys(DATA.TAGS).map((t) => `<button class="pk ${ui.qTag === t ? 'on' : ''}" data-tag="${t}">${DATA.TAGS[t].icon} ${DATA.TAGS[t].en}</button>`).join('');
  const cats = ['PLACE', 'DO', 'DONT'].map((c) => `<button class="pk ${ui.qCat === c ? 'on' : ''}" data-cat="${c}">${CAT_LABEL[c]}</button>`).join('');
  const plain = askSentence().replace(/<[^>]+>/g, '');
  return `<div class="panel">
    <h3>🗣️ 친구에게 질문하기 <small>친구는 내 비밀 카드를 볼 수 있어요</small></h3>
    <div style="margin-bottom:6px">1. 누구에게 물어볼까요?</div>
    <div class="ask-who">${others.map((s) => `<button class="who ${ui.askTo === s.seat ? 'on' : ''}" data-to="${s.seat}">${esc(seatName(s.seat))}</button>`).join('')}</div>
    <div style="margin-bottom:6px">2. 무엇을 물어볼까요?</div>
    <div class="qtabs">${Q_TABS.map((t) => `<button class="qtab ${ui.qKind === t.k ? 'on' : ''}" data-kind="${t.k}">${t.label}</button>`).join('')}</div>
    ${ui.qKind === 'is' ? `<div class="picker">${cats}</div>` : ''}
    <div class="picker">${ui.qKind === 'tag' ? tags : colors}</div>
    <div class="sentence"><span>${askSentence()}</span><button class="speak" id="say-ask" aria-label="듣기">🔊</button></div>
    <button class="btn sun block" id="do-ask" ${askReady() ? '' : 'disabled'} data-plain="${esc(plain)}">질문하기 · Ask!</button>
  </div>`;
}

function cluePanel() {
  const mine = V.log.filter((e) => e.type === 'ask' && e.from === V.mySeat).slice().reverse();
  const team = V.mode === 'team' ? V.log.filter((e) => e.type !== 'ask' || e.from !== V.mySeat).slice(-6).reverse() : [];
  const teamLine = (e) => {
    if (e.type === 'ask') return `${esc(seatName(e.from))} → ${esc(seatName(e.to))}: <span class="en">${esc(e.text)}</span>`;
    if (e.type === 'solve') return `🏆 ${esc(seatName(e.from))} 사건 해결! (${e.rank}등)`;
    if (e.type === 'wrong') return `❌ ${esc(seatName(e.from))} 보고서 오답`;
    return '';
  };
  return `<div class="panel" style="margin-top:14px">
    <h3>📒 내 단서 기록 <small>친구의 대답 = 내 비밀 카드 정보</small></h3>
    <div class="log">${mine.length ? mine.map((e) => `<div class="it mine"><div class="qq">Q. ${esc(e.text)}</div><div class="aa">${esc(seatName(e.to))}: ${esc(e.reply)}</div></div>`).join('') : '<div class="empty">아직 단서가 없어요. 미션을 맞히고 친구에게 질문해 보세요!</div>'}</div>
    ${team.length ? `<h3 style="margin-top:14px;font-size:16px">👥 우리 모둠 소식</h3><div class="log" style="max-height:150px">${team.map((e) => `<div class="it">${teamLine(e)}</div>`).join('')}</div>` : ''}
  </div>`;
}

// ── 오른쪽: 사건 보드 ──
function boardPanel() {
  const me = V.seats[V.mySeat];
  const done = V.phase === 'DONE';
  const order = [V.mySeat, ...V.seats.map((s) => s.seat).filter((i) => i !== V.mySeat)];
  const seatBox = (i) => {
    const s = V.seats[i];
    const isMe = i === V.mySeat;
    let st = '';
    if (s.solvedRank) st = `🏆 ${s.solvedRank}등 해결`;
    else if (s.bot) st = '컴퓨터 증인';
    else if (s.penalty) st = `벌칙: 미션 ${s.penalty}개`;
    else st = `✔ ${s.mCorrect}`;
    const cards = isMe
      ? (s.outer ? s.outer.map((id) => cardHTML(id, 'flip') + '').join('') : ['PLACE', 'DO', 'DONT'].map((c) => hiddenCard(c)).join(''))
      : s.outer.map((id) => cardHTML(id)).join('');
    return `<div class="board-seat ${isMe ? 'me' : ''}">
      <div class="seat-head">${isMe ? '🕵️ <b>나의 비밀 카드</b> <span style="font-size:13px;color:var(--ink2)">(친구만 볼 수 있어요)</span>' : esc(seatName(i)) + '<span style="font-size:13px;color:var(--ink2)">의 카드</span>'}<span class="st">${st}</span></div>
      <div class="cards" style="position:relative">${cards}${isMe && s.solvedRank ? '<div class="solved-stamp">CASE SOLVED</div>' : ''}</div>
    </div>`;
  };
  const letters = V.secretLetters.map((L) => {
    const seenId = V.myPeeked[L] || (done && V.secretReveal ? V.secretReveal.find((x) => x.letter === L).cardId : null);
    return seenId ? cardHTML(seenId, 'sm') : `<button class="env" data-peek="${L}" ${me.tokens ? '' : 'aria-disabled="true"'}>${L}<small>🔍 열기</small></button>`;
  }).join('');
  return `<div class="panel">
    <h3>🗂️ 사건 보드</h3>
    ${order.map(seatBox).join('')}
    <div class="board-seat"><div class="seat-head">🃏 내 손패 <span style="font-size:13px;color:var(--ink2)">(나만 봐요 · 내 비밀 카드가 아니에요)</span></div><div class="cards">${V.myInner.map((id) => cardHTML(id, 'sm')).join('')}</div></div>
    ${V.secretLetters.length ? `<div class="board-seat"><div class="seat-head">✉️ 비밀 봉투 <span style="font-size:13px;color:var(--ink2)">🔍 토큰 1개로 1장 확인</span></div><div class="secret-row">${letters}</div></div>` : ''}
    <div class="tools">
      <button class="btn ghost" id="open-notes">📝 추리 노트</button>
      ${!me.solvedRank && !done ? `<button class="btn red" id="open-report" ${me.penalty || V.phase === 'WAIT' ? 'disabled' : ''}>📮 사건 보고서 쓰기</button>` : ''}
    </div>
    ${me.penalty && !me.solvedRank ? `<p class="legend">⚠️ 미션을 ${me.penalty}개 더 맞히면 보고서를 다시 쓸 수 있어요.</p>` : ''}
  </div>`;
}

function resultPanel() {
  const me = V.seats[V.mySeat];
  const ranked = V.seats.filter((s) => !s.bot).slice().sort((a, b) => (a.solvedRank || 99) - (b.solvedRank || 99) || b.score - a.score);
  return `<div class="panel result">
    <div style="font-size:56px">${me.solvedRank ? '🏆' : '🔎'}</div>
    <h2 class="en">${me.solvedRank ? 'Case Solved!' : 'Case Closed'}</h2>
    <p>${me.solvedRank ? '멋져요! 지구를 지키는 단서를 모두 찾았어요.' : '게임이 끝났어요. 오른쪽에서 나의 비밀 카드를 확인해 보세요.'}</p>
    <p>미션 <b>${me.mCorrect}/${me.mTotal}</b> · 질문 <b>${me.asked}</b>번 · 점수 <b>${me.score}</b></p>
    ${V.mode === 'team' ? `<div class="rank-list">${ranked.map((s) => `<div><b>${s.solvedRank ? s.solvedRank + '등' : '-'}</b><span style="flex:1">${esc(s.name)}</span><span>🏅 ${s.score}</span></div>`).join('')}</div>` : ''}
    ${!store.get('code') ? '<p style="margin-top:16px"><button class="btn sun" id="again">🔁 새 사건 연습하기</button></p>' : ''}
  </div>`;
}

// ── 이벤트 연결 ──
function bindGame() {
  const app = $('#app');
  app.querySelectorAll('[data-opt]').forEach((b) => (b.onclick = () => {
    const ans = V.mission.options[+b.dataset.opt];
    app.querySelectorAll('[data-opt]').forEach((x) => (x.disabled = true));
    send({ t: 'mission', answer: ans });
  }));
  app.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = () => { (ui.order[V.mission.id] = ui.order[V.mission.id] || []).push(+b.dataset.pick); render(); }));
  app.querySelectorAll('[data-un]').forEach((b) => (b.onclick = () => { ui.order[V.mission.id] = ui.order[V.mission.id].filter((i) => i !== +b.dataset.un); render(); }));
  const or = $('#ord-reset'); if (or) or.onclick = () => { ui.order[V.mission.id] = []; render(); };
  const ok = $('#ord-ok'); if (ok) ok.onclick = () => send({ t: 'mission', answer: ui.order[V.mission.id].map((i) => V.mission.words[i]) });
  app.querySelectorAll('#say').forEach((b) => (b.onclick = () => speak(V.mission.say)));
  // 질문
  app.querySelectorAll('[data-to]').forEach((b) => (b.onclick = () => { ui.askTo = +b.dataset.to; render(); }));
  app.querySelectorAll('[data-kind]').forEach((b) => (b.onclick = () => { ui.qKind = b.dataset.kind; render(); }));
  app.querySelectorAll('[data-color]').forEach((b) => (b.onclick = () => { ui.qColor = b.dataset.color; render(); }));
  app.querySelectorAll('[data-tag]').forEach((b) => (b.onclick = () => { ui.qTag = b.dataset.tag; render(); }));
  app.querySelectorAll('[data-cat]').forEach((b) => (b.onclick = () => { ui.qCat = b.dataset.cat; render(); }));
  const sa = $('#say-ask'); if (sa) sa.onclick = () => speak($('#do-ask').dataset.plain);
  const da = $('#do-ask'); if (da) da.onclick = () => {
    const q = ui.qKind === 'tag' ? { kind: 'tag', value: ui.qTag } : ui.qKind === 'is' ? { kind: 'is', cat: ui.qCat, value: ui.qColor } : { kind: 'color', value: ui.qColor };
    speak(da.dataset.plain);
    send({ t: 'ask', to: ui.askTo, q });
    ui.qColor = null; ui.qTag = null;
  };
  // 보드
  app.querySelectorAll('[data-peek]').forEach((b) => (b.onclick = () => {
    if (!V.seats[V.mySeat].tokens) return toast('🔍 토큰이 없어요. 미션을 맞혀 토큰을 모으세요!');
    ui.modal = { type: 'peek', letter: b.dataset.peek }; renderModal();
  }));
  const on = $('#open-notes'); if (on) on.onclick = () => { ui.modal = { type: 'notes' }; renderModal(); };
  const rp = $('#open-report'); if (rp) rp.onclick = () => { ui.report = { step: 0, place: null, do: null, dont: null, s1: [], s2: [] }; ui.modal = { type: 'report' }; renderModal(); };
  const ag = $('#again'); if (ag) ag.onclick = () => { ui.seenSolved = false; send({ t: 'practice', name: store.get('name') || '탐정', pid }); };
}

// ── 추리 노트: 빈칸 → X → O ──
function notesKey() { return 'notes.' + V.gameId; }
function seenSet() {
  const s = new Set(V.myInner);
  V.seats.forEach((x) => { if (x.seat !== V.mySeat && x.outer) x.outer.forEach((id) => s.add(id)); });
  Object.values(V.myPeeked).forEach((id) => s.add(id));
  return s;
}
function notesHTML() {
  const marks = store.get(notesKey(), {});
  const seen = seenSet();
  const rows = ['PLACE', 'DO', 'DONT'];
  return `<table class="notes"><thead><tr><th style="width:68px"></th>${V.colorIds.map((c) => `<th><i class="dot" style="background:${COLOR[c].hex}"></i><br><span class="en" style="font-size:11px">${c}</span></th>`).join('')}</tr></thead>
    <tbody>${rows.map((cat) => `<tr><th style="font-size:13px">${CAT_LABEL[cat]}</th>${V.colorIds.map((c) => {
      const card = DATA.CARDS.find((x) => x.cat === cat && x.color === c);
      const isSeen = seen.has(card.id);
      const mk = isSeen ? '' : marks[card.id] || '';
      return `<td><button class="ncell ${isSeen ? 'seen' : ''} ${mk}" data-note="${card.id}" ${isSeen ? 'disabled' : ''} title="${esc(card.en)}"><span>${card.emoji}</span><small>${esc(card.en)}</small><span class="mk">${isSeen ? '' : mk}</span></button></td>`;
    }).join('')}</tr>`).join('')}</tbody></table>
    <p class="legend">칸을 누를 때마다 <b>빈칸 → X(아니야) → O(이거야!)</b>로 바뀌어요. 점선 칸은 내 눈에 보이는 카드라서 <b>내 비밀 카드가 아니에요.</b><br>
    내 비밀 카드는 줄마다 딱 1장씩 (PLACE 1 · DO 1 · DON'T 1) 있어요.</p>`;
}

function renderModal() {
  let el = $('#modal');
  if (!ui.modal || !V) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'modal'; el.className = 'modal'; document.body.appendChild(el); }
  const close = '<button class="x" data-close aria-label="닫기">✕</button>';
  if (ui.modal.type === 'notes') {
    el.innerHTML = `<div class="sheet"><div class="sheet-head"><h2>📝 추리 노트</h2>${close}</div>${notesHTML()}
      <h3 style="font-weight:400;margin:16px 0 8px">📒 내 단서</h3>
      <div class="log" style="max-height:200px">${V.log.filter((e) => e.type === 'ask' && e.from === V.mySeat).reverse().map((e) => `<div class="it mine"><div class="qq">Q. ${esc(e.text)}</div><div class="aa">${esc(e.reply)}</div></div>`).join('') || '<div class="empty">아직 단서가 없어요.</div>'}</div></div>`;
    el.querySelectorAll('[data-note]').forEach((b) => (b.onclick = () => {
      const marks = store.get(notesKey(), {});
      const cur = marks[b.dataset.note] || '';
      marks[b.dataset.note] = cur === '' ? 'X' : cur === 'X' ? 'O' : '';
      store.set(notesKey(), marks); renderModal();
    }));
  } else if (ui.modal.type === 'peek') {
    el.innerHTML = `<div class="sheet" style="max-width:420px;text-align:center"><div class="sheet-head"><h2>✉️ 비밀 봉투 ${ui.modal.letter}</h2>${close}</div>
      <p>🔍 토큰 1개를 써서 봉투 속 카드를 볼까요?<br><span style="color:var(--ink2)">봉투 속 카드는 아무의 카드도 아니에요.</span></p>
      <div class="row-btns"><button class="btn ghost" data-close>그만두기</button><button class="btn sun" id="peek-ok">열어 보기</button></div></div>`;
    $('#peek-ok').onclick = () => { send({ t: 'peek', letter: ui.modal.letter }); ui.modal = null; renderModal(); };
  } else if (ui.modal.type === 'report') {
    el.innerHTML = reportHTML();
    bindReport(el);
  }
  el.querySelectorAll('[data-close]').forEach((b) => (b.onclick = () => { ui.modal = null; ui.report = null; renderModal(); }));
}

// ── 사건 보고서 (해결하기) ──
const shuffleArr = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);
// "turn off the light" → ["turn off", "the light."]
function chunks(phrase) {
  const two = /^(turn off|throw away) /.exec(phrase);
  const verb = two ? two[1] : phrase.split(' ')[0];
  const rest = phrase.slice(verb.length).trim();
  return rest ? [verb, rest + '.'] : [verb + '.'];
}
function splitDo(id) { return ["Don't", 'forget', 'to', ...chunks(CARD[id].en)]; }
function splitDont(id) { return ["Don't", ...chunks(CARD[id].en)]; }
function reportHTML() {
  const R = ui.report;
  const seen = seenSet();
  const marks = store.get(notesKey(), {});
  const steps = ['① 카드 고르기', '② 보고서 문장 완성'];
  let body = '';
  if (R.step === 0) {
    body = ['PLACE', 'DO', 'DONT'].map((cat) => {
      const key = cat === 'PLACE' ? 'place' : cat === 'DO' ? 'do' : 'dont';
      const list = DATA.CARDS.filter((c) => c.cat === cat && V.colorIds.includes(c.color));
      return `<h3 style="font-weight:400;margin:12px 0 6px">${CAT_LABEL[cat]} 카드는?</h3><div class="pick-grid">${list.map((c) => {
        const off = seen.has(c.id) || marks[c.id] === 'X';
        return cardHTML(c.id, `sm ${R[key] === c.id ? 'on' : ''} ${off ? 'off' : ''}`, `data-pick-card="${key}|${c.id}" role="button" tabindex="0"`);
      }).join('')}</div>`;
    }).join('') + `<p class="legend">흐린 카드는 내 눈에 보이거나 노트에 X 한 카드예요.</p>
      <div class="row-btns"><button class="btn ghost" data-close>닫기</button><button class="btn sun" id="rep-next" ${R.place && R.do && R.dont ? '' : 'disabled'}>다음: 문장 쓰기</button></div>`;
  } else {
    if (!R.w1) { R.w1 = splitDo(R.do); R.w2 = splitDont(R.dont); R.p1 = shuffleArr(R.w1.map((_, i) => i)); R.p2 = shuffleArr(R.w2.map((_, i) => i)); }
    const line = (words, pool, picked, key) => `<div class="chips answer">${picked.length ? picked.map((i) => `<button class="chip" data-r-un="${key}|${i}">${esc(words[i])}</button>`).join('') : '<span style="color:var(--ink2);padding:8px">낱말을 순서대로 눌러요</span>'}</div>
      <div class="chips">${pool.filter((i) => !picked.includes(i)).map((i) => `<button class="chip" data-r-pick="${key}|${i}">${esc(words[i])}</button>`).join('')}</div>`;
    const ok1 = R.s1.length === R.w1.length, ok2 = R.s2.length === R.w2.length;
    body = `<div class="report-paper">
      <div class="en" style="font-weight:800;font-size:22px">📰 Earth News · Case Report</div>
      <div class="line">📍 ${esc(CARD[R.place].prep[0].toUpperCase() + CARD[R.place].prep.slice(1))} ${CARD[R.place].emoji}</div>
      <div style="margin-top:8px">✅ 해야 할 일 ${CARD[R.do].emoji}</div>${line(R.w1, R.p1, R.s1, 's1')}
      <div style="margin-top:8px">🚫 하지 말아야 할 일 ${CARD[R.dont].emoji}</div>${line(R.w2, R.p2, R.s2, 's2')}
      <div class="line" style="margin-top:12px">We should save the world. 🌏</div>
    </div>
    <p class="err" id="rep-err"></p>
    <div class="row-btns"><button class="btn ghost" id="rep-back">카드 다시 고르기</button><button class="btn red" id="rep-send" ${ok1 && ok2 ? '' : 'disabled'}>📮 보고서 제출</button></div>`;
  }
  return `<div class="sheet"><div class="sheet-head"><h2>📮 사건 보고서</h2><button class="x" data-close aria-label="닫기">✕</button></div>
    <div class="steps">${steps.map((s, i) => `<span class="${i === R.step ? 'on' : ''}">${s}</span>`).join('')}</div>
    <p style="margin:0 0 6px;color:var(--ink2)">틀리면 미션 2개를 더 맞혀야 다시 쓸 수 있어요. 신중하게!</p>${body}</div>`;
}
function bindReport(el) {
  const R = ui.report;
  el.querySelectorAll('[data-pick-card]').forEach((b) => (b.onclick = () => { const [k, id] = b.dataset.pickCard.split('|'); R[k] = id; renderModal(); }));
  const nx = $('#rep-next', el); if (nx) nx.onclick = () => { R.step = 1; R.w1 = null; R.s1 = []; R.s2 = []; renderModal(); };
  const bk = $('#rep-back', el); if (bk) bk.onclick = () => { R.step = 0; renderModal(); };
  el.querySelectorAll('[data-r-pick]').forEach((b) => (b.onclick = () => { const [k, i] = b.dataset.rPick.split('|'); R[k].push(+i); renderModal(); }));
  el.querySelectorAll('[data-r-un]').forEach((b) => (b.onclick = () => { const [k, i] = b.dataset.rUn.split('|'); R[k] = R[k].filter((x) => x !== +i); renderModal(); }));
  const sd = $('#rep-send', el); if (sd) sd.onclick = () => {
    const t1 = R.s1.map((i) => R.w1[i]).join(' '), t2 = R.s2.map((i) => R.w2[i]).join(' ');
    if (t1 !== R.w1.join(' ') || t2 !== R.w2.join(' ')) {
      $('#rep-err', el).textContent = '문장 순서를 다시 확인해 보세요! (Don\'t forget to … / Don\'t …)';
      return;
    }
    speak(`${t1} ${t2} We should save the world.`);
    send({ t: 'solve', guess: { place: R.place, do: R.do, dont: R.dont } });
  };
}

// ── 친구가 보낸 질문에 대답 ──
function renderIncoming() {
  let el = $('#incoming');
  const inc = V && V.incoming[0];
  if (!inc) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'incoming'; el.className = 'incoming'; document.body.appendChild(el); }
  const asker = V.seats[inc.from];
  const yesno = inc.q.kind === 'is';
  el.innerHTML = `<div class="sheet">
    <div class="who-asks">📣 <b>${esc(asker.name)}</b>의 질문이에요!</div>
    <div class="q">${esc(inc.text)}</div>
    <button class="speak" id="inc-say" aria-label="듣기">🔊</button>
    <p style="margin:12px 0 6px">${esc(asker.name)}의 비밀 카드를 보고 대답해 주세요 👇</p>
    <div class="cards" style="justify-content:center">${asker.outer.map((id) => cardHTML(id, 'sm')).join('')}</div>
    ${inc.wrongTries ? '<p class="err">다시 세어 보세요! Count again.</p>' : ''}
    <div class="nums">${yesno
      ? `<button class="btn" data-n="1">Yes, it is. 👍</button><button class="btn red" data-n="0">No, it isn't. 👎</button>`
      : [0, 1, 2, 3].map((n) => `<button class="btn" data-n="${n}">${n}</button>`).join('')}</div>
    ${yesno ? '' : '<p style="color:var(--ink2);margin-top:10px" class="en">You have ___ .</p>'}
  </div>`;
  $('#inc-say').onclick = () => speak(inc.text);
  el.querySelectorAll('[data-n]').forEach((b) => (b.onclick = () => {
    const n = +b.dataset.n;
    speak(yesno ? (n ? 'Yes, it is.' : "No, it isn't.") : `You have ${['zero', 'one', 'two', 'three'][n]}.`);
    send({ t: 'answer', id: inc.id, n });
  }));
}

// 대기 막대 갱신
setInterval(() => {
  const bar = $('#wait-bar');
  if (bar && V && V.outgoing) {
    const left = Math.max(0, V.answerLimit - (Date.now() + (ui.skew || 0) - V.outgoing.at) / 1000);
    bar.style.width = (left / V.answerLimit) * 100 + '%';
  }
}, 1000);

// ── 시작 ──
fetch('/api/data').then((r) => r.json()).then((d) => {
  DATA = d;
  d.CARDS.forEach((c) => (CARD[c.id] = c));
  d.COLORS.forEach((c) => (COLOR[c.id] = c));
  render();
  connect();
});
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
